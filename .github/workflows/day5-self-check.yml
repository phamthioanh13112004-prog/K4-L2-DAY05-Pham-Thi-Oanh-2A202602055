name: Day 5 self-check

on:
  push:
    paths:
      - submissions/**
      - REPORT.md
      - .github/workflows/day5-self-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: day5-self-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Check CVAT export structure
        shell: bash
        run: |
          set +e
          python scripts/inspect_submissions.py --dir submissions > "$RUNNER_TEMP/structure.txt" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/structure.txt"
          {
            echo '## Day 5 — kiểm cấu trúc ZIP'
            echo '```text'
            cat "$RUNNER_TEMP/structure.txt"
            echo '```'
            if [ "$result" -ne 0 ]; then
              echo 'Có ZIP lỗi cấu trúc. Sửa trong CVAT, Save, export lại và push lại.'
            else
              echo 'OK chỉ xác nhận cấu trúc; chưa chứng minh mask đúng.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check whether the official reference has been released
        id: reference
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view day5-reference-v1 \
              --repo VinUni-AI20k/Day5-Segmentation-Lab-Student \
              --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq 'day5-groundtruth.zip'; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '## Điểm tự đánh giá' >> "$GITHUB_STEP_SUMMARY"
            echo 'Chưa có gói ground truth chính thức. Sau khi được phát trong giờ cuối, chọn Actions → Day 5 self-check → Run workflow hoặc push ZIP mới để chạy lại.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download and validate the official tier reference
        if: steps.reference.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release download day5-reference-v1 \
            --repo VinUni-AI20k/Day5-Segmentation-Lab-Student \
            --pattern day5-groundtruth.zip \
            --dir "$RUNNER_TEMP"
          python scripts/install_reference.py "$RUNNER_TEMP/day5-groundtruth.zip"

      - name: Score completed Easy, Medium and Hard exports
        if: steps.reference.outputs.available == 'true'
        shell: bash
        run: |
          if [ ! -f submissions/easy_semantic.zip ] && \
             [ ! -f submissions/medium_instance.zip ] && \
             [ ! -f submissions/hard_panoptic.zip ]; then
            echo '## Điểm tự đánh giá' >> "$GITHUB_STEP_SUMMARY"
            echo 'Chưa có ZIP Easy, Medium hoặc Hard trong submissions/. Hãy export ít nhất một task rồi push để xem điểm.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m pip install -r requirements.txt
          if ! python scoring/scorecard.py --group tiers --dir submissions \
              --out "$RUNNER_TEMP/day5-score" > "$RUNNER_TEMP/scoring.txt" 2>&1; then
            {
              echo '## Không tính được điểm tự đánh giá'
              echo '```text'
              cat "$RUNNER_TEMP/scoring.txt"
              echo '```'
              echo 'Kiểm ZIP/format hoặc báo coach. Không tự sửa JSON trong ZIP.'
            } >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/scoring.txt"
            exit 1
          fi
          cat "$RUNNER_TEMP/scoring.txt"
          {
            echo '## Điểm tự đánh giá sau khi phát đáp án'
            cat "$RUNNER_TEMP/day5-score/SCORECARD.md"
            echo ''
            echo '**Đây là phản hồi ba task tối đa 82 điểm, không phải điểm chính thức /100, PASS, bonus hay bảng xếp hạng.**'
            echo 'Sửa mask trong CVAT → Save → export ZIP mới → push lại để nhận phản hồi mới.'
          } >> "$GITHUB_STEP_SUMMARY"
